<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0B1F3A; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #34495E; }
      .section-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #003B70; }
      .box-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #003B70; }
      .box-text { font-family: Arial, sans-serif; font-size: 15px; fill: #1F2937; }
      .small-text { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; }
      .box { fill: #F8FBFF; stroke: #003B70; stroke-width: 2; rx: 16; }
      .box-green { fill: #F3FFF8; stroke: #1B7F4C; stroke-width: 2; rx: 16; }
      .box-purple { fill: #FBF7FF; stroke: #5B2C83; stroke-width: 2; rx: 16; }
      .box-orange { fill: #FFF8F0; stroke: #B45F06; stroke-width: 2; rx: 16; }
      .box-gray { fill: #F9FAFB; stroke: #6B7280; stroke-width: 2; rx: 16; }
      .lane { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 2; rx: 22; }
      .arrow { stroke: #003B70; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-green { stroke: #1B7F4C; stroke-width: 3; fill: none; marker-end: url(#arrowhead-green); }
      .arrow-dash { stroke: #6B7280; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#003B70"/></marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#1B7F4C"/></marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <text x="60" y="60" class="title">AI Agent-Based Claims Processing Platform</text>
  <text x="60" y="92" class="subtitle">Architecture view: Streamlit prototype, Python agent orchestration, GitHub, Azure Cosmos DB, and future Microsoft ecosystem layers</text>

  <rect x="50" y="130" width="1500" height="150" class="lane"/>
  <text x="75" y="165" class="section-title">1. Engineering and Source Control Layer</text>

  <rect x="90" y="190" width="220" height="60" class="box-gray"/>
  <text x="110" y="215" class="box-title">VS Code</text>
  <text x="110" y="238" class="box-text">Local development</text>

  <rect x="370" y="190" width="240" height="60" class="box-gray"/>
  <text x="390" y="215" class="box-title">GitHub Copilot</text>
  <text x="390" y="238" class="box-text">Code generation and refactoring</text>

  <rect x="670" y="190" width="270" height="60" class="box-gray"/>
  <text x="690" y="215" class="box-title">GitHub Repositories</text>
  <text x="690" y="238" class="box-text">claims-csv and claims-cosmos</text>

  <rect x="1010" y="190" width="240" height="60" class="box-gray"/>
  <text x="1030" y="215" class="box-title">Branch Strategy</text>
  <text x="1030" y="238" class="box-text">main, cosmos-stabilization</text>

  <line x1="310" y1="220" x2="370" y2="220" class="arrow"/>
  <line x1="610" y1="220" x2="670" y2="220" class="arrow"/>
  <line x1="940" y1="220" x2="1010" y2="220" class="arrow"/>

  <rect x="50" y="315" width="1500" height="240" class="lane"/>
  <text x="75" y="350" class="section-title">2. Application and Agent Workflow Layer</text>

  <rect x="90" y="390" width="230" height="90" class="box"/>
  <text x="110" y="418" class="box-title">Streamlit Cloud</text>
  <text x="110" y="444" class="box-text">User interface</text>
  <text x="110" y="466" class="small-text">FNOL, dashboards, audit views</text>

  <rect x="390" y="390" width="260" height="90" class="box"/>
  <text x="410" y="418" class="box-title">Orchestrator</text>
  <text x="410" y="444" class="box-text">Controls workflow sequence</text>
  <text x="410" y="466" class="small-text">Intake to Reporting</text>

  <rect x="720" y="365" width="300" height="140" class="box-green"/>
  <text x="740" y="393" class="box-title">Python AI Agents</text>
  <text x="740" y="420" class="box-text">Intake Agent</text>
  <text x="740" y="442" class="box-text">Policy Verification Agent</text>
  <text x="740" y="464" class="box-text">Adjuster Agent</text>
  <text x="740" y="486" class="box-text">Processing and Reporting Agents</text>

  <rect x="1090" y="390" width="270" height="90" class="box-green"/>
  <text x="1110" y="418" class="box-title">Cosmos Data Access Layer</text>
  <text x="1110" y="444" class="box-text">cosmos_store.py</text>
  <text x="1110" y="466" class="small-text">Centralized read/write access</text>

  <line x1="320" y1="435" x2="390" y2="435" class="arrow"/>
  <line x1="650" y1="435" x2="720" y2="435" class="arrow"/>
  <line x1="1020" y1="435" x2="1090" y2="435" class="arrow"/>

  <rect x="50" y="590" width="1500" height="250" class="lane"/>
  <text x="75" y="625" class="section-title">3. Cloud Data and Persistence Layer</text>

  <rect x="90" y="665" width="260" height="100" class="box-orange"/>
  <text x="110" y="693" class="box-title">Azure Cosmos DB</text>
  <text x="110" y="720" class="box-text">Account: claims-cosmos-db</text>
  <text x="110" y="742" class="box-text">Database: claimsdb</text>

  <rect x="430" y="650" width="850" height="130" class="box-orange"/>
  <text x="455" y="680" class="box-title">Cosmos Containers</text>
  <text x="455" y="710" class="box-text">claims | policies | adjusters | payments</text>
  <text x="455" y="735" class="box-text">tasks | documents | claim_notes | agent_events</text>
  <text x="455" y="760" class="small-text">Partition keys: claim_id, policy_id, adjuster_id depending on container</text>

  <line x1="1225" y1="480" x2="1225" y2="590" class="arrow-green"/>
  <line x1="1225" y1="590" x2="350" y2="710" class="arrow-green"/>
  <line x1="350" y1="715" x2="430" y2="715" class="arrow-green"/>

  <rect x="50" y="875" width="1500" height="95" class="lane"/>
  <text x="75" y="908" class="section-title">4. Reporting and Future Microsoft Platform Layer</text>

  <rect x="420" y="925" width="220" height="32" class="box-purple"/>
  <text x="440" y="947" class="box-title">Power BI</text>

  <rect x="710" y="925" width="260" height="32" class="box-purple"/>
  <text x="730" y="947" class="box-title">Copilot Studio</text>

  <rect x="1040" y="925" width="260" height="32" class="box-purple"/>
  <text x="1060" y="947" class="box-title">Power Apps / Power Automate</text>

  <line x1="600" y1="840" x2="530" y2="925" class="arrow-dash"/>
  <line x1="850" y1="840" x2="840" y2="925" class="arrow-dash"/>
  <line x1="1080" y1="840" x2="1170" y2="925" class="arrow-dash"/>

  <rect x="1320" y="650" width="180" height="130" class="box-gray"/>
  <text x="1340" y="680" class="box-title">CSV Prototype</text>
  <text x="1340" y="710" class="box-text">Legacy version</text>
  <text x="1340" y="735" class="small-text">Public repo:</text>
  <text x="1340" y="755" class="small-text">claims-csv</text>

  <line x1="1390" y1="390" x2="1390" y2="650" class="arrow-dash"/>

  <text x="60" y="985" class="small-text">Architecture outcome: transformed CSV-backed proof of concept into a Cosmos DB-backed cloud-native AI claims workflow platform.</text>
</svg>
